# =============================================================
# 车险出单智能体 — 后端公共配置
# 敏感信息一律走环境变量，不在仓库中存放真实值
# 本地开发用 application-dev.yml（dev profile）
# =============================================================

spring:
  application:
    name: car-insurance-backend

  # ---------- 数据源 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:car_insurance}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: CarInsuranceHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 300000

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.carinsurance.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- 服务器 ----------
server:
  port: ${SERVER_PORT:8080}

# ---------- OpenAPI ----------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ---------- 自定义 ----------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5180}
  # ---------- 文件存储 ----------
  file-storage:
    storage: LOCAL
    local-path: ${FILE_STORAGE_PATH:}   # 留空则自动用系统临时目录/car-insurance-files
    max-size-bytes: 10485760            # 10MB
    allowed-mime-prefixes:
      - image/
      - application/pdf
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
      - pdf
    ai-temp-url-expire-minutes: 10

# ---------- JWT ----------
jwt:
  # HS256 对称密钥，32 字节以上（必须！），走环境变量
  secret: ${JWT_SECRET:car-insurance-agent-backend-dev-secret-key-min-32-bytes!}
  access-token-expire-minutes: 120   # 2h
  refresh-token-expire-days: 7

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,datasource,metrics
  endpoint:
    health:
      show-details: always
      show-components: always

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.example.carinsurance: DEBUG
    com.baomidou.mybatisplus: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
